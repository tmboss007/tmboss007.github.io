<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0d1117;--fg:#e0e4eb;--card:rgba(20,26,35,0.5);--muted:#1c2333;--muted-fg:#6b7a90;
--border:#1e2a3a;--cyan:#38d2dc;--purple:#9364dc;--pink:#dc5096;--green:#3cc878;
--primary:#38d2dc;
}
html{
scroll-behavior:smooth;
scroll-padding-top: 80px; 
}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:0 24px}

/* Grid bg */
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(30,42,58,0.3) 1px,transparent 1px),linear-gradient(90deg,rgba(30,42,58,0.3) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}

/* Cursor Glow */
.cursor-glow{
position:fixed;
width:300px;
height:300px;
background:radial-gradient(circle,rgba(56,210,220,0.12),transparent 70%);
pointer-events:none;
z-index:0;
transform:translate(-50%,-50%);
filter:blur(30px);
transition:transform 0.05s linear;
}

/* Scrollbar */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan),var(--purple),var(--pink));border-radius:4px}

/* Navbar */
nav{position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(12px);border-bottom:1px solid transparent;padding:16px 0;transition:all 0.5s}
nav.scrolled{background:rgba(13,17,23,0.9);border-bottom-color:var(--border);box-shadow:0 4px 20px rgba(56,210,220,0.05)}
nav .inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 24px}
.logo{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--primary);transition:color 0.3s}
.logo:hover .bracket{color:var(--green)}
.bracket{transition:color 0.3s}
.blink{animation:blink 1s step-end infinite;color:var(--pink)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.nav-links{display:flex;gap:4px}
.nav-links a{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted-fg);transition:all 0.3s;padding:8px 12px;border-radius:6px;position:relative}
.nav-links a:hover{color:var(--primary);background:rgba(56,210,220,0.05)}
.nav-links a::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:2px;background:var(--primary);transition:all 0.3s;transform:translateX(-50%)}
.nav-links a:hover::after{width:80%}
.nav-links a .arrow{opacity:0;transition:all 0.3s;display:inline-block;transform:translateX(-4px);color:var(--green)}
.nav-links a:hover .arrow{opacity:1;transform:translateX(0)}
.nav-social{display:flex;gap:12px}
.nav-social a{color:var(--muted-fg);transition:all 0.3s}
.nav-social a:hover{color:var(--primary);transform:scale(1.1);filter:drop-shadow(0 0 8px rgba(56,210,220,0.6))}

/* Sections */
section{position:relative;z-index:1;padding:96px 0}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding-top:80px;position:relative}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(28,35,51,0.5);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:9999px;padding:8px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted-fg);margin-bottom:12px;transition:border-color 0.5s}
.badge:hover{border-color:rgba(60,200,120,0.4)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
h1{font-size:clamp(3rem,8vw,6rem);font-weight:900;line-height:1.1;margin-bottom:24px}
.gradient-text{background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.typing-line{font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:var(--muted-fg);max-width:600px;margin:0 auto 32px}
.typing-cursor{animation:blink 1s step-end infinite;color:var(--primary)}
.hero-desc{font-size:1rem;color:var(--muted-fg);max-width:600px;margin:0 auto 32px}
.btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn-primary{background:var(--primary);color:var(--bg);padding:12px 24px;border-radius:8px;font-weight:600;transition:all 0.3s;position:relative;overflow:hidden}
.btn-primary:hover{box-shadow:0 0 25px rgba(56,210,220,0.4);transform:scale(1.05)}
.btn-primary .prefix{font-family:'JetBrains Mono',monospace;font-size:13px;opacity:0;transition:opacity 0.3s}
.btn-primary:hover .prefix{opacity:1}
.btn-outline{border:1px solid var(--border);background:rgba(28,35,51,0.5);backdrop-filter:blur(8px);padding:12px 24px;border-radius:8px;font-weight:600;transition:all 0.3s}
.btn-outline:hover{border-color:var(--primary);box-shadow:0 0 15px rgba(147,100,220,0.2);transform:scale(1.05)}
.btn-outline .suffix{font-family:'JetBrains Mono',monospace;color:var(--green);opacity:0;transition:opacity 0.3s}
.btn-outline:hover .suffix{opacity:1}
.stats{display:flex;gap:48px;justify-content:center;margin-top:64px}
.stats .num{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transition:transform 0.3s}
.stats > div:hover .num{transform:scale(1.1)}
.stats .label{font-size:13px;color:var(--muted-fg)}

/* Scroll indicator */
.scroll-indicator{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);animation:bounce 2s infinite;color:var(--muted-fg)}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* Section headers */
.section-line{display:inline-block;height:1px;width:48px;background:linear-gradient(to right,transparent,var(--primary));vertical-align:middle}
.section-sub{text-align:center;color:var(--muted-fg);margin-bottom:48px;max-width:500px;margin-left:auto;margin-right:auto;font-family:'JetBrains Mono',monospace;font-size:13px}
.section-sub .cmd{color:var(--green)}
.section-sub .str{color:var(--cyan)}
h2{font-size:2rem;font-weight:700;text-align:center;margin-bottom:12px}

/* Skills */
.skills-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:700px;margin:0 auto}
.skill{font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 16px;border-radius:9999px;border:1px solid;transition:all 0.5s;cursor:default;opacity:0;transform:translateY(24px)}
.skill.visible{opacity:1;transform:translateY(0)}
.skill:hover{transform:scale(1.1) !important}
.skill-cyan{border-color:rgba(56,210,220,0.3);color:var(--cyan)}.skill-cyan:hover{background:rgba(56,210,220,0.1);border-color:rgba(56,210,220,0.6);box-shadow:0 0 15px rgba(56,210,220,0.2)}
.skill-purple{border-color:rgba(147,100,220,0.3);color:var(--purple)}.skill-purple:hover{background:rgba(147,100,220,0.1);border-color:rgba(147,100,220,0.6);box-shadow:0 0 15px rgba(147,100,220,0.2)}
.skill-pink{border-color:rgba(220,80,150,0.3);color:var(--pink)}.skill-pink:hover{background:rgba(220,80,150,0.1);border-color:rgba(220,80,150,0.6);box-shadow:0 0 15px rgba(220,80,150,0.2)}
.skill-green{border-color:rgba(60,200,120,0.3);color:var(--green)}.skill-green:hover{background:rgba(60,200,120,0.1);border-color:rgba(60,200,120,0.6);box-shadow:0 0 15px rgba(60,200,120,0.2)}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:1000px;margin:0 auto}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;padding:24px;transition:all 0.5s;position:relative;overflow:hidden;opacity:0;transform:translateY(40px)}
.card.visible{opacity:1;transform:translateY(0)}
.card:hover{transform:translateY(-8px) !important}
.card.glow-cyan:hover{box-shadow:0 0 30px rgba(56,210,220,0.3);border-color:rgba(56,210,220,0.5)}
.card.glow-purple:hover{box-shadow:0 0 30px rgba(147,100,220,0.3);border-color:rgba(147,100,220,0.5)}
.card.glow-pink:hover{box-shadow:0 0 30px rgba(220,80,150,0.3);border-color:rgba(220,80,150,0.5)}
.card.glow-green:hover{box-shadow:0 0 30px rgba(60,200,120,0.3);border-color:rgba(60,200,120,0.5)}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(56,210,220,0.03),transparent);transform:translateX(-100%);transition:transform 0.7s}
.card:hover::before{transform:translateX(100%)}

.status{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 12px;border-radius:9999px;border:1px solid;display:inline-block;margin-bottom:12px}
.status-built{background:rgba(60,200,120,0.15);color:var(--green);border-color:rgba(60,200,120,0.3)}
.status-wip{background:rgba(220,80,150,0.15);color:var(--pink);border-color:rgba(220,80,150,0.3);animation:pulse 2s infinite}
.card h3{font-size:1.2rem;font-weight:700;margin-bottom:8px;transition:color 0.3s}
.card:hover h3{color:var(--primary)}
.card .desc{font-size:0.85rem;color:var(--muted-fg);margin-bottom:16px;line-height:1.5}
.card .emoji{font-size:1.5rem;transition:transform 0.3s}
.card:hover .emoji{animation:bounce 0.6s}
.tech-tag{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--muted);color:var(--muted-fg);padding:4px 8px;border-radius:4px;display:inline-block;margin-right:6px;border:1px solid var(--border);margin-bottom:6px;}

/* Timeline */
.timeline{max-width:700px;margin:0 auto;position:relative}
.timeline-line{position:absolute;left:31px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--cyan),var(--purple),var(--pink))}
.tl-item{position:relative;display:flex;gap:16px;align-items:flex-start;margin-bottom:24px;opacity:0;transform:translateX(-40px)}
.tl-item.visible{opacity:1;transform:translateX(0)}
.tl-dot{position:absolute;left:25px;top:32px;width:14px;height:14px;border-radius:50%;z-index:2}
.tl-dot-cyan{background:var(--cyan);box-shadow:0 0 10px rgba(56,210,220,0.5)}
.tl-dot-purple{background:var(--purple);box-shadow:0 0 10px rgba(147,100,220,0.5)}
.tl-dot-pink{background:var(--pink);box-shadow:0 0 10px rgba(220,80,150,0.5)}
.tl-content{margin-left:56px;background:var(--card);backdrop-filter:blur(8px);border-radius:12px;padding:24px;border
